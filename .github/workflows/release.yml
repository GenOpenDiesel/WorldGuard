name: Build & Release

# Kazda zmiana w kodzie (push na branch folia) buduje plugin i publikuje release.
on:
  push:
    branches:
      - folia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Compute release tag
        id: ver
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag=build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=WorldGuard (Folia) build #${GITHUB_RUN_NUMBER} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body: |
            Automatyczny build (Folia) z commita ${{ github.sha }} (branch `${{ github.ref_name }}`).
          files: |
            worldguard-bukkit/build/libs/*-dist.jar
          fail_on_unmatched_files: true
